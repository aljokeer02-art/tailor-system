# ملاحظة: بعد الانتقال لقاعدة بيانات Supabase الخارجية، لم تعد هناك حاجة لقرص دائم
# (Persistent Disk) — أصبحت خطة Render المجانية (Free) كافية لأن البيانات لا تُخزَّن
# على القرص المحلي للسيرفر بعد الآن. هذا الملف اختياري إن رغبت لاحقاً باستخدام
# Render بدلاً من Vercel أو بالإضافة إليه.
services:
  - type: web
    name: tailor-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_EMAIL
        value: alsaadamr94@gmail.com
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false   # الصق رابط اتصال Supabase Postgres هنا من لوحة Render
